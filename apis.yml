name: AllTrails
description: AllTrails is an outdoor recreation platform for discovering, mapping, and navigating hiking,
  trail running, mountain biking, and backpacking routes. It offers a searchable database of hundreds of
  thousands of trails worldwide with maps, elevation profiles, community reviews, photos, and conditions,
  plus GPS turn-by-turn navigation, offline downloadable maps, and route planning through its AllTrails+
  subscription. AllTrails is a consumer mobile and web application; it does not publish a public developer
  API program, and its web surface is served behind a Cloudflare WAF that blocks automated discovery. This
  profile was surfaced as a portfolio company of 500 Global and enriched with the verifiable public signals
  available.
